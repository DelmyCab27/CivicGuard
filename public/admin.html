<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Mando · CivicGuard Admin</title>
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <style>
    :root {
      --bg: #0b1020;
      --bg2: #121a33;
      --panel: #161f3d;
      --line: #2a3766;
      --text: #eef3ff;
      --muted: #a2afd4;
      --amber: #ffb020;
      --red: #ff4d4d;
      --cyan: #3de0c5;
      --blue: #5b8cff;
      --purple: #b388ff;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1100px 480px at 90% -10%, rgba(91,140,255,.18), transparent 60%),
        radial-gradient(800px 400px at -10% 110%, rgba(61,224,197,.10), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    [hidden] { display: none !important; }

    /* ---------- Login ---------- */
    .login-wrap {
      min-height: 100vh; display: grid; place-items: center; padding: 20px;
    }
    .login-card {
      width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 20px; padding: 28px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.55);
    }
    .login-brand { text-align: center; margin-bottom: 20px; }
    .login-brand svg { width: 54px; height: 54px; margin-bottom: 8px; }
    .login-brand h1 { margin: 0; font-size: 1.35rem; }
    .login-brand p { margin: 4px 0 0; font-size: .85rem; color: var(--cyan); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    .field { margin-bottom: 14px; }
    label { display: block; font-size: .88rem; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    input[type="password"], input[type="text"], textarea, select {
      width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
      border: 1.5px solid var(--line); background: var(--bg2); color: var(--text);
      font-family: inherit; font-size: .96rem;
    }
    textarea { min-height: 92px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: 3px solid var(--cyan); outline-offset: 1px; }
    .error-msg { color: #ff9c9c; font-size: .86rem; font-weight: 700; margin: 6px 0 10px; }

    button, .link-pill, .file-label {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 0; cursor: pointer;
      font-family: inherit; font-size: .92rem; font-weight: 800; text-decoration: none;
      background: linear-gradient(135deg, var(--amber), #ff8a1f); color: #1b1300;
    }
    button.full { width: 100%; }
    button.ghost, .link-pill, .file-label {
      background: transparent; color: var(--text); border: 1.5px solid var(--line);
    }
    button.ghost:hover, .link-pill:hover, .file-label:hover { border-color: var(--amber); color: var(--amber); }
    button.small { min-height: 40px; padding: 8px 14px; font-size: .84rem; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    /* ---------- Dashboard ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      padding: 14px 20px; background: rgba(11,16,32,.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 38px; height: 38px; flex: none; }
    .brand h1 { margin: 0; font-size: 1.15rem; }
    .brand p { margin: 0; font-size: .74rem; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .container { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px;
    }
    .kpi span { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .kpi strong { display: block; font-size: 1.75rem; margin-top: 4px; }
    .kpi.c-blue strong { color: var(--blue); }
    .kpi.c-purple strong { color: var(--purple); }
    .kpi.c-cyan strong { color: var(--cyan); }

    .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      min-height: 40px; padding: 6px 14px; border-radius: 999px; font-size: .84rem;
      background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    }
    .filter-btn.active { background: var(--amber); color: #1b1300; border-color: var(--amber); }

    .grid { display: grid; gap: 12px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--blue);
      border-radius: var(--radius); padding: 16px; display: grid; gap: 12px;
    }
    .card.p-alta { border-left-color: var(--red); }
    .card.p-media { border-left-color: var(--amber); }
    .card.p-baja { border-left-color: var(--cyan); }

    .card-head { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
    .card-info { flex: 1; min-width: 240px; }
    .card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .card-title h2 { margin: 0; font-size: 1.1rem; }
    .tag {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px;
      font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    }
    .tag.recibido { background: var(--blue); color: #fff; }
    .tag.en_proceso { background: var(--purple); color: #14082b; }
    .tag.resuelto { background: var(--cyan); color: #0b1020; }
    .tag.alta { background: var(--red); color: #fff; }

    .desc { margin: 6px 0; color: #dbe3fa; font-size: .95rem; }
    .admin-note-box {
      margin: 8px 0 0; padding: 8px 12px; border-radius: 10px;
      background: rgba(61,224,197,.08); border: 1px solid rgba(61,224,197,.28);
      font-size: .86rem; color: var(--text);
    }
    .meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; color: var(--muted); margin-top: 8px; }
    .photos-pair { display: flex; gap: 8px; flex: none; }
    .thumb-wrap { text-align: center; }
    .thumb-wrap span { display: block; font-size: .7rem; color: var(--muted); margin-top: 2px; font-weight: 700; }
    .thumb {
      width: 86px; height: 86px; border-radius: 12px; object-fit: cover;
      border: 1px solid var(--line); cursor: zoom-in; background: var(--bg2);
    }

    .card-actions {
      display: flex; justify-content: flex-end; gap: 8px; padding-top: 10px;
      border-top: 1px solid rgba(42,55,102,.65);
    }
    .empty {
      text-align: center; padding: 36px 16px; border: 2px dashed var(--line);
      border-radius: var(--radius); color: var(--muted);
    }

    /* ---------- Modales ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; padding: 16px;
      background: rgba(6,9,20,.84); backdrop-filter: blur(6px);
      display: grid; place-items: center;
    }
    .modal-card {
      width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 20px; padding: 22px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.6);
    }
    .modal-card h2 { margin: 0 0 12px; font-size: 1.2rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .preview-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; margin-top: 8px; border: 1px solid var(--line); }

    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      background: #fff; color: #101528; font-weight: 800; padding: 12px 18px;
      border-radius: 12px; z-index: 80; box-shadow: 0 10px 30px rgba(0,0,0,.5);
      max-width: min(92vw, 460px); text-align: center;
    }
    .lightbox {
      position: fixed; inset: 0; background: rgba(6,9,20,.9); z-index: 75;
      display: grid; place-items: center; padding: 20px; cursor: zoom-out;
    }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 14px; border: 1px solid var(--line); }
  </style>
</head>
<body>
  <!-- ==================== PANTALLA DE LOGIN ==================== -->
  <section id="login-view" class="login-wrap">
    <form id="login-form" class="login-card">
      <div class="login-brand">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 3 42 9v13c0 11-7.5 19.5-18 23C13.5 41.5 6 33 6 22V9z" fill="var(--amber)"/>
          <path d="M24 8 37 12.5V22c0 8.5-5.5 15-13 18-7.5-3-13-9.5-13-18v-9.5z" fill="var(--bg)"/>
          <circle cx="24" cy="21" r="5" fill="var(--red)"/>
          <path d="m24 33-5.5-8h11z" fill="var(--red)"/>
        </svg>
        <h1>CivicGuard</h1>
        <p>Acceso Municipal</p>
      </div>
      <div class="field">
        <label for="login-user">Usuario</label>
        <input type="text" id="login-user" value="admin" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" placeholder="Ingresa la contraseña…" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="error-msg" role="alert" hidden></p>
      <button type="submit" id="btn-login" class="full">Iniciar sesión</button>
      <p style="text-align:center;margin:14px 0 0;"><a href="/" class="link-pill small">Volver a la App Ciudadana</a></p>
    </form>
  </section>

  <!-- ==================== CENTRO DE MANDO ==================== -->
  <div id="dashboard-view" hidden>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 3 42 9v13c0 11-7.5 19.5-18 23C13.5 41.5 6 33 6 22V9z" fill="var(--amber)"/>
          <path d="M24 8 37 12.5V22c0 8.5-5.5 15-13 18-7.5-3-13-9.5-13-18v-9.5z" fill="var(--bg)"/>
          <circle cx="24" cy="21" r="5" fill="var(--red)"/>
          <path d="m24 33-5.5-8h11z" fill="var(--red)"/>
        </svg>
        <div>
          <h1>CivicGuard · Centro de Mando</h1>
          <p id="operator-label">Operador Municipal</p>
        </div>
      </div>
      <div class="top-actions">
        <a href="/" class="link-pill small">App Ciudadana</a>
        <button type="button" id="btn-test-push" class="ghost small">Push de prueba</button>
        <button type="button" id="btn-refresh" class="ghost small">Actualizar</button>
        <button type="button" id="btn-logout" class="ghost small">Cerrar sesión</button>
      </div>
    </header>

    <main class="container">
      <section class="kpis" aria-label="Resumen de incidencias">
        <div class="kpi"><span>Total recibidos</span><strong id="kpi-total">0</strong></div>
        <div class="kpi c-blue"><span>Recibidos</span><strong id="kpi-recibido">0</strong></div>
        <div class="kpi c-purple"><span>En proceso</span><strong id="kpi-proceso">0</strong></div>
        <div class="kpi c-cyan"><span>Resueltos</span><strong id="kpi-resuelto">0</strong></div>
      </section>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filtrar por estado">
          <button type="button" class="filter-btn active" data-filter="all">Todos</button>
          <button type="button" class="filter-btn" data-filter="recibido">Recibidos</button>
          <button type="button" class="filter-btn" data-filter="en_proceso">En proceso</button>
          <button type="button" class="filter-btn" data-filter="resuelto">Resueltos</button>
          <button type="button" class="filter-btn" data-filter="alta">Urgentes</button>
        </div>
      </div>

      <section id="reports-grid" class="grid" aria-live="polite">
        <div class="empty">Cargando reportes del servidor…</div>
      </section>
    </main>
  </div>

  <!-- ==================== MODAL: ACTUALIZAR AVANCE ==================== -->
  <div id="update-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="upd-title" hidden>
    <form id="update-form" class="modal-card">
      <h2 id="upd-title">Actualizar avance del reporte</h2>
      <div class="field">
        <label for="upd-status">Nuevo estatus</label>
        <select id="upd-status" required>
          <option value="recibido">Recibido</option>
          <option value="en_proceso">En proceso</option>
          <option value="resuelto">Resuelto (envía notificación Push)</option>
        </select>
      </div>
      <div class="field">
        <label for="upd-note">Nota para el ciudadano</label>
        <textarea id="upd-note" maxlength="400" placeholder="Ej. Cuadrilla #3 en camino / Bache reparado con mezcla asfáltica…"></textarea>
      </div>
      <div class="field">
        <label for="upd-photo">Foto de evidencia de solución (opcional)</label>
        <input type="file" id="upd-photo" accept="image/*" hidden>
        <label for="upd-photo" class="file-label small" style="width:100%;">Elegir foto del trabajo realizado</label>
        <img id="upd-preview" class="preview-img" alt="Vista previa de solución" hidden>
      </div>
      <div class="modal-actions">
        <button type="button" id="btn-upd-cancel" class="ghost">Cancelar</button>
        <button type="submit" id="btn-upd-save">Guardar avance</button>
      </div>
    </form>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="Evidencia ampliada">
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      let reports = [];
      let activeFilter = 'all';
      let editingId = null;
      let sessionToken = sessionStorage.getItem('cg_admin_token') || '';
      let sessionUser = sessionStorage.getItem('cg_admin_user') || 'Operador';

      function toast(msg, ms = 3200) {
        const el = $('toast');
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => { el.hidden = true; }, ms);
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function enterDashboard() {
        $('login-view').hidden = true;
        $('dashboard-view').hidden = false;
        $('operator-label').textContent = `Operador: ${sessionUser}`;
        loadReports();
      }

      function logout() {
        sessionToken = '';
        sessionStorage.removeItem('cg_admin_token');
        sessionStorage.removeItem('cg_admin_user');
        $('login-pass').value = '';
        $('dashboard-view').hidden = true;
        $('login-view').hidden = false;
      }

      $('login-form').addEventListener('submit', async e => {
        e.preventDefault();
        const user = $('login-user').value.trim() || 'admin';
        const password = $('login-pass').value;
        const errEl = $('login-error');
        errEl.hidden = true;
        $('btn-login').disabled = true;

        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, password })
          });
          if (!res.ok) throw new Error('Usuario o contraseña incorrectos');
          sessionToken = password;
          sessionUser = user;
          sessionStorage.setItem('cg_admin_token', password);
          sessionStorage.setItem('cg_admin_user', user);
          enterDashboard();
        } catch (err) {
          errEl.textContent = err.message;
          errEl.hidden = false;
        } finally {
          $('btn-login').disabled = false;
        }
      });

      $('btn-logout').addEventListener('click', logout);

      async function loadReports() {
        try {
          const res = await fetch('/api/reports', { cache: 'no-store' });
          if (!res.ok) throw new Error('Error ' + res.status);
          reports = (await res.json()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          render();
        } catch (e) {
          $('reports-grid').innerHTML = `<div class="empty">No se pudieron cargar los reportes: ${esc(e.message)}</div>`;
        }
      }

      function render() {
        $('kpi-total').textContent = reports.length;
        $('kpi-recibido').textContent = reports.filter(r => r.status === 'recibido').length;
        $('kpi-proceso').textContent = reports.filter(r => r.status === 'en_proceso').length;
        $('kpi-resuelto').textContent = reports.filter(r => r.status === 'resuelto').length;

        const filtered = reports.filter(r => {
          if (activeFilter === 'all') return true;
          if (activeFilter === 'alta') return r.priority === 'alta';
          return r.status === activeFilter;
        });

        const grid = $('reports-grid');
        if (!filtered.length) {
          grid.innerHTML = '<div class="empty">No hay reportes en esta categoría todavía.</div>';
          return;
        }

        const statusLabels = { recibido: 'Recibido', en_proceso: 'En proceso', resuelto: 'Resuelto' };
        grid.innerHTML = filtered.map(r => {
          const when = new Date(r.createdAt || Date.now()).toLocaleString('es-MX');
          const loc = r.lat != null ? `${Number(r.lat).toFixed(5)}, ${Number(r.lng).toFixed(5)}` : 'Sin coordenadas';
          return `
            <article class="card p-${esc(r.priority || 'media')}">
              <div class="card-head">
                <div class="card-info">
                  <div class="card-title">
                    <h2>${esc(r.type)}</h2>
                    <span class="tag ${esc(r.status)}">${esc(statusLabels[r.status] || r.status)}</span>
                    ${r.priority === 'alta' ? '<span class="tag alta">Urgente</span>' : ''}
                  </div>
                  <p class="desc">${esc(r.description)}</p>
                  ${r.adminNote ? `<p class="admin-note-box"><strong>Última nota:</strong> ${esc(r.adminNote)}</p>` : ''}
                  <div class="meta">
                    <span>Fecha: ${esc(when)}</span>
                    <span>Ubicación: ${esc(loc)}</span>
                  </div>
                </div>
                <div class="photos-pair">
                  ${r.photo ? `<div class="thumb-wrap"><img class="thumb" src="${esc(r.photo)}" alt="Antes" data-zoom="${esc(r.photo)}"><span>Antes</span></div>` : ''}
                  ${r.resolvedPhoto ? `<div class="thumb-wrap"><img class="thumb" src="${esc(r.resolvedPhoto)}" alt="Después" data-zoom="${esc(r.resolvedPhoto)}"><span>Después</span></div>` : ''}
                </div>
              </div>
              <div class="card-actions">
                <button type="button" class="small" data-open-update="${esc(r.id)}">Actualizar avance</button>
              </div>
            </article>
          `;
        }).join('');
      }

      function openUpdateModal(id) {
        const r = reports.find(item => item.id === id);
        if (!r) return;
        editingId = id;
        $('upd-title').textContent = `Atender: ${r.type}`;
        $('upd-status').value = r.status === 'recibido' ? 'en_proceso' : (r.status || 'en_proceso');
        $('upd-note').value = r.adminNote || '';
        $('upd-photo').value = '';
        $('upd-preview').hidden = true;
        $('update-modal').hidden = false;
        $('upd-note').focus();
      }

      $('upd-photo').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) { $('upd-preview').hidden = true; return; }
        $('upd-preview').src = URL.createObjectURL(file);
        $('upd-preview').hidden = false;
      });

      $('btn-upd-cancel').addEventListener('click', () => { $('update-modal').hidden = true; });

      $('update-form').addEventListener('submit', async e => {
        e.preventDefault();
        if (!editingId) return;
        const status = $('upd-status').value;
        const note = $('upd-note').value.trim();
        const file = $('upd-photo').files[0];

        const fd = new FormData();
        fd.append('status', status);
        if (note) fd.append('note', note);
        if (file) fd.append('resolvedPhoto', file, 'solucion.jpg');

        $('btn-upd-save').disabled = true;
        try {
          const res = await fetch(`/api/reports/${encodeURIComponent(editingId)}/status`, {
            method: 'PATCH',
            headers: { 'x-admin-token': sessionToken },
            body: fd
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) { logout(); toast('Sesión expirada, inicia sesión de nuevo.'); return; }
          if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
          $('update-modal').hidden = true;
          toast(status === 'resuelto'
            ? 'Reporte marcado como Resuelto y notificación Push enviada.'
            : 'Avance guardado correctamente.');
          await loadReports();
        } catch (err) {
          toast('Error: ' + err.message);
        } finally {
          $('btn-upd-save').disabled = false;
        }
      });

      $('reports-grid').addEventListener('click', e => {
        const btn = e.target.closest('button[data-open-update]');
        if (btn) openUpdateModal(btn.dataset.openUpdate);
        const img = e.target.closest('img[data-zoom]');
        if (img) {
          $('lightbox-img').src = img.dataset.zoom;
          $('lightbox').hidden = false;
        }
      });

      $('lightbox').addEventListener('click', () => { $('lightbox').hidden = true; });

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
          render();
        });
      });

      $('btn-refresh').addEventListener('click', loadReports);

      $('btn-test-push').addEventListener('click', async () => {
        try {
          const res = await fetch('/api/push/test', {
            method: 'POST',
            headers: { 'x-admin-token': sessionToken }
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) { logout(); return; }
          if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
          toast(`Notificación de prueba enviada a ${data.sent} dispositivo(s).`);
        } catch (err) {
          toast('Error al enviar Push: ' + err.message);
        }
      });

      if (sessionToken) enterDashboard();
    })();
  </script>
</body>
</html>
